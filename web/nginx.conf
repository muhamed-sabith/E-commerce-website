server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Product images are served by the API (re-encoded uploads, hardened headers).
    location /assets/ {
        proxy_pass http://api:4000;
    }

    # SPA fallback — React Router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
